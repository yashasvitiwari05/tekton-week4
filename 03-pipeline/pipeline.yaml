apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ci-pipeline
  labels:
    app.kubernetes.io/version: "1.0"
  annotations:
    tekton.dev/displayName: "CI Pipeline"
    tekton.dev/description: >-
      End-to-end CI pipeline: clone → print files → validate YAML → build image → deploy.
spec:
  description: >-
    Clones a repository, inspects files, validates YAML manifests,
    builds a container image, and deploys the application to Kubernetes.

  params:
    - name: repo-url
      type: string
      description: Git repository URL.
    - name: revision
      type: string
      default: "main"
      description: Branch / tag / SHA to check out.
    - name: image-name
      type: string
      description: "Container image to build, e.g. docker.io/myorg/myapp"
    - name: image-tag
      type: string
      default: "latest"
      description: Image tag.
    - name: deploy-namespace
      type: string
      default: "default"
      description: Kubernetes namespace to deploy into.

  workspaces:
    - name: source
      description: Shared workspace for source code.
    - name: docker-credentials
      description: Docker config.json secret for image push.
    - name: git-credentials
      optional: true
      description: SSH / token credentials for private repos.

  results:
    - name: commit-sha
      description: Git commit SHA that was built.
      value: $(tasks.clone-repo.results.commit-sha)
    - name: image-digest
      description: OCI digest of the built image.
      value: $(tasks.build-image.results.IMAGE_DIGEST)
    - name: yaml-validation-status
      description: YAML lint result.
      value: $(tasks.validate-yaml.results.validation-status)

  tasks:
    # ── 1. Clone ──────────────────────────────────────────────────────────────
    - name: clone-repo
      taskRef:
        name: clone-repository
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source

    # ── 2. Print Files ────────────────────────────────────────────────────────
    - name: print-files
      taskRef:
        name: print-files
      runAfter:
        - clone-repo
      params:
        - name: sub-path
          value: "."
        - name: show-content
          value: "false"
      workspaces:
        - name: source
          workspace: source

    # ── 3. Validate YAML ──────────────────────────────────────────────────────
    - name: validate-yaml
      taskRef:
        name: validate-yaml
      runAfter:
        - clone-repo
      params:
        - name: yamllint-config
          value: "relaxed"
        - name: run-kubeval
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # ── 4. Build Image (Kaniko) ───────────────────────────────────────────────
    - name: build-image
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: kaniko
          - name: namespace
            value: tekton-pipelines
      runAfter:
        - validate-yaml
        - print-files
      params:
        - name: IMAGE
          value: $(params.image-name):$(params.image-tag)
        - name: DOCKERFILE
          value: ./Dockerfile
        - name: CONTEXT
          value: .
        - name: EXTRA_ARGS
          value:
            - "--cache=true"
            - "--cache-repo=$(params.image-name)-cache"
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: docker-credentials

    # ── 5. Deploy ─────────────────────────────────────────────────────────────
    - name: deploy
      taskRef:
        name: kubernetes-deploy
      runAfter:
        - build-image
      params:
        - name: image
          value: $(params.image-name):$(params.image-tag)
        - name: namespace
          value: $(params.deploy-namespace)
      workspaces:
        - name: source
          workspace: source

  # ── Finally ──────────────────────────────────────────────────────────────────
  finally:
    - name: workspace-cleanup
      taskRef:
        name: workspace-cleanup
      workspaces:
        - name: source
          workspace: source

    - name: notify-result
      taskRef:
        name: send-notification
      params:
        - name: pipeline-status
          value: "$(tasks.deploy.status)"
        - name: commit-sha
          value: "$(tasks.clone-repo.results.commit-sha)"
