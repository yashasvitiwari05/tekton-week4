apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clone-repository
  labels:
    app.kubernetes.io/version: "1.0"
  annotations:
    tekton.dev/displayName: "Clone Repository"
    tekton.dev/description: "Clones a Git repository into a shared workspace."
spec:
  description: >-
    Clones a Git repository from a given URL and revision into
    the 'source' workspace so downstream tasks can access the code.

  params:
    - name: repo-url
      type: string
      description: URL of the Git repository to clone.
    - name: revision
      type: string
      default: "main"
      description: Branch, tag, or commit SHA to checkout.
    - name: depth
      type: string
      default: "1"
      description: Number of commits to fetch (shallow clone).

  workspaces:
    - name: source
      description: Workspace where the repo will be cloned.

  results:
    - name: commit-sha
      description: The exact commit SHA that was checked out.
    - name: repo-url
      description: The URL of the cloned repository.

  steps:
    - name: clone
      image: alpine/git:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -eu

        echo "Cloning $(params.repo-url) @ $(params.revision)"

        git clone \
          --depth=$(params.depth) \
          --branch=$(params.revision) \
          $(params.repo-url) \
          .

        SHA=$(git rev-parse HEAD)
        echo "Checked out commit: ${SHA}"

        printf "%s" "${SHA}"              > $(results.commit-sha.path)
        printf "%s" "$(params.repo-url)" > $(results.repo-url.path)

        echo "Clone complete."
