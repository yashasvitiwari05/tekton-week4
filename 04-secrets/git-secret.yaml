# NOTE: Replace base64-encoded values before applying.
# echo -n "YOUR_TOKEN" | base64
apiVersion: v1
kind: Secret
metadata:
  name: git-credentials
  annotations:
    tekton.dev/git-0: https://github.com
type: kubernetes.io/basic-auth
stringData:
  username: git                  # GitHub username or 'git' for SSH
  password: "YOUR_GITHUB_TOKEN"  # Personal Access Token (PAT)
